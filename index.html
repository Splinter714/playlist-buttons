<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0c0c0e" />
    <title>playlist buttons</title>

    <!-- Installable as a standalone Home Screen app. Without a manifest (or the Apple
         meta below, for older iOS) "Add to Home Screen" makes a bookmark that opens in
         Safari, and the shortcut's return trip lands in Safari too. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="playlist buttons" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  </head>
  <body>
    <!-- The only navigation there is: grid ⇄ settings (#5/#6/#8), on the URL hash so
         the phone's back gesture works and the return from a transition (#4) lands
         back on the grid. -->
    <header id="topbar">
      <span id="topbar-title">playlist buttons</span>
      <a id="nav-settings" href="#settings">settings</a>
    </header>

    <!-- The button grid (issue #2), or the settings screen. -->
    <main id="app"></main>
    <div id="app-status"></div>

    <!-- The debug view from issue #1 — still how auth and the rotation join get verified
         by eye, so it stays reachable even though the grid is now the main view. -->
    <div id="debug-bar">
      <button id="debug-toggle" type="button" aria-expanded="false" aria-controls="debug">debug view</button>
    </div>
    <section id="debug" hidden>
      <h1>playlist-buttons (debug view)</h1>
      <div id="auth"></div>
      <div id="status"></div>
      <div id="playlists"></div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
